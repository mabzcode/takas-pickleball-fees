<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Takas Pickleball – Court Fee Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --navy:#03172E; --lime:#B5F757;
  --bg:#EDF2F7; --surface:#FFFFFF; --ink:#03172E; --muted:#56698A; --line:#D5DFEA; --line-strong:#9DB0C6;
  --sel:#E4FBC2; --sel-line:#7CC21F;
  --pick-bg:#03172E; --pick-ink:#B5F757;
  --btn-line:#03172E; --focus:#1F6FEB; --danger:#B3261E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#020E1C; --surface:#0A2240; --ink:#EAF2FB; --muted:#93A7BF; --line:#173A60; --line-strong:#3A5D86;
    --sel:rgba(181,247,87,.14); --sel-line:#B5F757;
    --pick-bg:#B5F757; --pick-ink:#03172E; --btn-line:transparent; --focus:#B5F757; --danger:#FF8A7D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#020E1C; --surface:#0A2240; --ink:#EAF2FB; --muted:#93A7BF; --line:#173A60; --line-strong:#3A5D86;
  --sel:rgba(181,247,87,.14); --sel-line:#B5F757;
  --pick-bg:#B5F757; --pick-ink:#03172E; --btn-line:transparent; --focus:#B5F757; --danger:#FF8A7D;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;
  min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));
  font-variant-numeric:tabular-nums;
}
body.has-save{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2{line-height:1.2}

/* header */
.top{background:var(--navy);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;z-index:20}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;flex:none;display:block}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:17px;font-weight:800;letter-spacing:-.01em}
.ttl p{font-size:12px;font-weight:500;color:#A9BDD4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;flex:none}
.icon-btn:focus-visible{outline-color:#B5F757}

.wrap{max-width:560px;margin:0 auto;padding:16px}
.note{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;padding:10px 12px;margin-bottom:12px}

/* fee card: the ball and its band */
.fee{position:relative;height:224px;border-radius:28px;background:var(--lime);color:var(--navy);overflow:hidden;isolation:isolate}
.fee .band{
  position:absolute;left:-8%;right:-8%;top:50%;height:80px;margin-top:-40px;
  background:var(--navy);transform:rotate(-5deg);
  display:flex;align-items:baseline;justify-content:center;gap:10px;padding-top:12px;z-index:1;
}
.fee .each{font-weight:900;font-size:clamp(40px,13vw,58px);line-height:1;color:#fff;letter-spacing:-.02em}
.fee .each-l{font-size:15px;font-weight:700;color:var(--lime)}
.fee .each.pop{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94)}to{transform:scale(1)}}
.hole{position:absolute;background:var(--navy);border-radius:50%;z-index:0}
.h1{width:58px;height:40px;right:20px;top:-8px;transform:rotate(-24deg)}
.h2{width:36px;height:26px;right:92px;top:24px;transform:rotate(-14deg)}
.h3{width:56px;height:42px;right:22px;bottom:22px;transform:rotate(-20deg)}
.h4{width:44px;height:30px;right:82px;bottom:-8px;transform:rotate(-12deg)}
.fee .t,.fee .b{position:absolute;left:18px;z-index:2}
.fee .t{top:16px;right:36%;font-size:13px;font-weight:700;line-height:1.3}
.fee .b{bottom:14px;right:32%}
.fee .b b{display:block;font-size:14px;font-weight:800;line-height:1.3}
.fee .b span{display:block;font-size:12px;font-weight:600;line-height:1.3}

/* cards and fields */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:15px;font-weight:800}
.count{background:var(--pick-bg);color:var(--pick-ink);border-radius:999px;padding:4px 11px;font-weight:800;font-size:12px}
.field+.field{margin-top:14px}
.lbl,label.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:14px}
.grid2 .field+.field{margin-top:0}
input[type=text],input[type=search],input[type=number],input[type=date],select{
  width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--bg);
  padding:0 14px;font-weight:600;font-size:15px;color:var(--ink);
}
input::placeholder{color:var(--muted);font-weight:500}
.date-row{display:flex;gap:8px;align-items:center}
.date-row input{flex:1;min-width:0}
.day-badge{flex:none;height:48px;padding:0 12px;border-radius:12px;background:var(--pick-bg);color:var(--pick-ink);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.hint{font-size:12px;font-weight:600;color:var(--muted);margin-top:8px}
.stepper{display:flex;align-items:center;justify-content:space-between;height:52px;border:1.5px solid var(--line-strong);border-radius:14px;background:var(--bg)}
.stepper button{width:56px;height:100%;background:none;border:0;font-size:22px;font-weight:800;border-radius:12px}
.stepper button:disabled{opacity:.3}
.stepper output{font-weight:800;font-size:17px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{height:52px;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--bg);font-weight:800;font-size:18px}
.seg button[aria-pressed=true]{background:var(--pick-bg);color:var(--pick-ink);border-color:var(--pick-bg)}
.seg.sm{display:inline-grid;grid-template-columns:auto auto;gap:4px}
.seg.sm button{height:34px;padding:0 12px;font-size:12px;border-radius:999px}
.court-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.court-row:last-child{border-bottom:0}
.court-row-lbl{flex:1;font-weight:800;font-size:14px}
.stepper.sm{height:40px;width:132px;flex:none}
.stepper.sm button{width:40px;font-size:18px}
.stepper.sm output{font-size:14px}
.link.danger{color:var(--danger)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:16px;font-weight:800;font-size:15px;border:2px solid var(--line-strong);background:var(--surface)}
.btn.primary{background:var(--lime);color:var(--navy);border-color:var(--btn-line)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.sm{min-height:40px;padding:0 14px;font-size:13px;border-radius:12px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip-btn{height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:13px}
.link{background:none;border:0;color:var(--muted);font-weight:700;font-size:13px;text-decoration:underline;padding:10px 4px}

/* roster */
.addp{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 14px;border-radius:14px;background:var(--lime);color:var(--navy);border:2px solid var(--btn-line);font-weight:800;text-align:left;margin-bottom:8px}
.addp span{flex:1;min-width:0;overflow-wrap:anywhere}
.pl{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.pl+.pl{margin-top:8px}
.pl.on{background:var(--sel);border-color:var(--sel-line)}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line-strong);display:grid;place-items:center;flex:none;color:var(--navy)}
.box svg{opacity:0}
.pl.on .box{background:var(--lime);border-color:var(--navy)}
.pl.on .box svg{opacity:1}
.nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.ct{font-size:12px;font-weight:600;color:var(--muted);flex:none}
.foot{display:flex;justify-content:flex-end;margin-top:6px}
.empty{padding:22px 8px;text-align:center}
.empty h2{font-size:16px;font-weight:800;margin-bottom:6px}
.empty p{font-size:13px;color:var(--muted);font-weight:500;max-width:32ch;margin:0 auto}
.skel{height:224px;border-radius:28px;background:var(--line);opacity:.6}

/* records and players lists */
.tools{display:flex;justify-content:flex-end;margin-bottom:4px}
.mh{margin-top:18px;margin-bottom:2px}
.mh h2{font-size:15px;font-weight:800}
.mh p{font-size:12px;font-weight:600;color:var(--muted)}
.g{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden}
.g-h{display:flex;align-items:center;gap:10px;width:100%;padding:14px;background:none;border:0;text-align:left}
.g-l{flex:1;min-width:0;display:flex;flex-direction:column}
.g-l b,.g-r b{font-weight:800;font-size:15px}
.g-l span,.g-r span{font-size:12px;font-weight:600;color:var(--muted)}
.g-r{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.chev{color:var(--muted);display:grid;place-items:center;transition:transform .15s}
.g.open .chev{transform:rotate(180deg)}
.g-b{padding:0 14px 14px;border-top:1px solid var(--line)}
.g-b .sum{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line-strong);font-size:12px;font-weight:700;color:var(--muted)}
.chip.paid{background:var(--sel);border-color:var(--sel-line);color:var(--ink)}
.chip.editing{border-color:var(--focus);color:var(--ink)}
.chip svg{flex:none}
.paid-hint{font-size:11px;font-weight:600;color:var(--muted);margin-top:8px}
.fund-note{font-size:12px;font-weight:700;color:var(--sel-line);margin-top:4px}
.pay-edit-row{margin-top:10px;padding:10px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--bg)}
.pay-edit-name{font-size:12px;font-weight:700;margin-bottom:8px}
.pay-edit-row .row{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.seg.sm.pay-method{grid-template-columns:repeat(2,1fr)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0}
.add-row .btn{min-height:48px}
.m{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:8px;overflow:hidden}
.m-h{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;background:none;border:0;text-align:left;min-height:56px}
.m-h .nm{flex:1}
.m-h small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.m-b{padding:0 14px 14px;border-top:1px solid var(--line)}
.m-b .add-row{margin-top:14px}
.m-b .acts{margin-top:10px}

/* balances */
.bal-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.bal-row:first-child{border-top:0}
.bal-row .nm{font-weight:700}
.bal-amt{font-size:13px;font-weight:800;color:var(--muted)}
.bal-amt.danger{color:var(--danger)}
.bal-amt.credit{color:var(--sel-line)}

/* bars */
.savebar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px}
.savebar-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.savebar .btn.primary{flex:1}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;font-size:11px;font-weight:700;color:var(--muted)}
.tabs .ico{display:grid;place-items:center;padding:3px 18px;border-radius:999px}
.tabs button[aria-current=page]{color:var(--ink)}
.tabs button[aria-current=page] .ico{background:var(--lime);color:var(--navy)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--navy);color:#fff;border:1px solid #1E3E66;padding:11px 16px;border-radius:14px;font-weight:700;font-size:13px;max-width:min(92vw,420px);text-align:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ovl{position:fixed;inset:0;background:rgba(3,23,46,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.admin-line{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.admin-line button{background:none;border:0;padding:0;color:var(--ink);font-weight:800;text-decoration:underline;cursor:pointer;font-size:12px}
.pay-row-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pay-row-in input{flex:1 1 90px;min-width:0}
.pay-row-in select{flex:0 1 96px;min-width:0}
.pay-row-in .btn{flex:none}
.bal-row-btn{width:100%;text-align:left;background:none;border:0;cursor:pointer}
.bal-row .nm small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.month-row{padding:10px 0;border-top:1px solid var(--line)}
.month-row:first-child{border-top:0}
.month-row-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.month-row-h span{font-size:12px;font-weight:600;color:var(--muted)}
.month-row-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.month-row-g div{text-align:center;background:var(--bg);border-radius:10px;padding:8px 4px}
.month-row-g .mrl{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:2px}
.month-row-g b{font-size:14px}
.month-row-g b.danger{color:var(--danger)}
.month-row-fund{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--sel);border:1px solid var(--sel-line);display:flex;justify-content:space-between;align-items:baseline}
.month-row-fund .mrl{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:0}
.month-row-fund b{font-size:14px;color:var(--sel-line)}
.sheet h2{font-size:17px;font-weight:800;margin-bottom:14px}
.sheet .row{display:flex;gap:10px;margin-top:16px}
.sheet .row .btn{flex:1}
textarea.copybox{width:100%;min-height:180px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--bg);padding:12px;font-weight:600;font-size:14px;resize:vertical}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDate(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
var dfLong = new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
var dfMonth = new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric'});
var dfShort = new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short'});
var dfDay = new Intl.DateTimeFormat('en-US',{weekday:'short'});
function fmtDay(s){ return dfDay.format(parseDate(s)); }
function fmtDate(s){ return dfLong.format(parseDate(s)); }
function fmtShort(s){ return dfShort.format(parseDate(s)); }
function peso(n){
  n = Math.round(n*100)/100;
  var t = Number.isInteger(n) ? n.toLocaleString('en-PH') : n.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
  return '\u20B1'+t;
}
function fmtHrs(h){ return (h===1 ? '1 hr' : h+' hrs'); }
function courtsLbl(c){ return c+' court'+(c===1?'':'s'); }
/* Legacy-compatible reader: returns an array of hours, one per court, for a
   saved game. New records store this directly as g.courts (an array); older
   records stored a single g.hours applied uniformly across a g.courts count. */
function gameCourtHours(g){
  if(g && Array.isArray(g.courts)) return g.courts.slice();
  var n=(g && g.courts) || 1, h=(g && g.hours) || 0, arr=[];
  for(var i=0;i<n;i++) arr.push(h);
  return arr;
}
function courtsSummary(arr){
  arr = (arr && arr.length) ? arr : [0];
  if(arr.length===1) return fmtHrs(arr[0])+' · 1 court';
  var allSame = arr.every(function(h){return h===arr[0];});
  if(allSame) return fmtHrs(arr[0])+' · '+courtsLbl(arr.length);
  return arr.map(function(h,i){return 'Court '+(i+1)+': '+fmtHrs(h);}).join(', ');
}
function cmpName(a,b){ return a.localeCompare(b, undefined, {sensitivity:'base'}); }
function uid(){ return 'm_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

var ICON = {
  check:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  copy:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  chev:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
};

/* ---------- state ---------- */
var LS_KEY='takas-pickleball-v1', DRAFT_KEY='takas-pickleball-draft-v1', ADMIN_KEY='takas-admin-unlocked-v1';
var DEFAULTS={rate:50, minFee:25, pin:''};
var S = {
  tab:'home', mode:'loading', ready:false, inited:false, db:null, downloads:null,
  members:[], games:[], settings:{rate:50,minFee:25,pin:''}, stats:{}, pendingAdminCb:null,
  date:todayStr(), courts:[1], ids:new Set(), loadedDate:null,
  q:'', openGame:null, confirmDel:null, payEdit:null, openMember:null, showHidden:false, sortBy:'az', dirty:false
};

/* ---------- fee math ---------- */
function calc(courtHours, n, s){
  var totalHours = (courtHours||[]).reduce(function(a,h){return a+(+h||0);},0);
  var total = Math.round(totalHours*s.rate*100)/100;
  if(!n) return {total:total,n:0,each:0,collected:0,note:''};
  var raw = total/n, up = Math.ceil(raw-1e-9);
  var each = Math.max(s.minFee, up);
  var collected = each*n, note='';
  if(Math.abs(collected-total) > 0.001){
    note = (up < s.minFee ? 'Min '+peso(s.minFee)+' each' : 'Rounded up')+' \u00B7 collects '+peso(collected);
  }
  return {total:total,n:n,each:each,collected:collected,note:note};
}
function presentIds(){ return Array.from(S.ids).filter(function(id){ return S.members.some(function(m){return m.id===id;}); }); }
function nameOf(id){ var m=S.members.find(function(x){return x.id===id;}); return m ? m.name : 'Unknown player'; }
function curCalc(){ return calc(S.courts, presentIds().length, S.settings); }
function gamePaidInfo(g, id){
  if(g && g.paid && Object.prototype.hasOwnProperty.call(g.paid, id)){
    var v=g.paid[id];
    if(v && typeof v==='object') return {amount:+v.amount||0, method:(v.method==='gcash'?'gcash':'cash')};
    return {amount:+v||0, method:'cash'}; /* legacy plain-number paid amount */
  }
  if(g && g.paidIds && g.paidIds.indexOf(id)!==-1) return {amount:g.each||0, method:'cash'}; /* legacy paid/unpaid data */
  return {amount:0, method:'cash'};
}
function gamePaidAmount(g, id){ return gamePaidInfo(g, id).amount; }
function gamePaidMethod(g, id){ return gamePaidInfo(g, id).method; }
/* When each player's share is rounded up or bumped to the minimum fee, the
   amount actually collected can exceed the true court fee (rate x hours).
   That extra is kept aside for court/game expenses (balls, etc). */
function gameExcess(g){
  var n=(g.playerIds||[]).length;
  var ex = (g.each||0)*n - (g.total||0);
  return ex>0.001 ? Math.round(ex*100)/100 : 0;
}
function isUnlocked(){
  try{ return localStorage.getItem(ADMIN_KEY)==='1'; }catch(e){ return false; }
}
/* Runs `action` immediately once this device is unlocked for payments (or no
   PIN has been set yet, so there's nothing to protect). Otherwise prompts for
   the PIN first and runs `action` only once it's entered correctly. */
function promptAdmin(action){

/* ---------- firebase realtime database (shared storage outside claude.ai) ---------- */
var FB_URL = 'https://takas-pickleball-fees-default-rtdb.firebaseio.com';
function fbUrl(path){ return FB_URL+'/'+path+'.json'; }
function fbObjToArr(obj){
  return obj ? Object.keys(obj).map(function(k){ return Object.assign({}, obj[k], {id:k}); }) : [];
}
async function fbPut(path, data){
  var res = await fetch(fbUrl(path), {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
  if(!res.ok) throw new Error('firebase put failed: '+res.status);
}
async function fbDelete(path){
  var res = await fetch(fbUrl(path), {method:'DELETE'});
  if(!res.ok) throw new Error('firebase delete failed: '+res.status);
}
async function loadFirebase(){
  try{
    var res = await fetch(fbUrl(''), {cache:'no-store'});
    if(!res.ok) return false;
    var data = (await res.json()) || {};
    S.members = fbObjToArr(data.members);
    S.games = fbObjToArr(data.games);
    S.settings = Object.assign({}, DEFAULTS, data.settings||{});
    return true;
  }catch(e){ return false; }
}
async function pollFirebase(){
  if(S.mode!=='firebase') return;
  var ok = await loadFirebase();
  if(ok) onData(true);
}
function startFirebasePolling(){
  setInterval(pollFirebase, 6000);
}

/* ---------- boot ---------- */
async function boot(){
  render();
  var db=null, dl=null;
  try{
    if(window.claude && window.claude.use){
      var r = await Promise.all([window.claude.use('db'), window.claude.use('downloads')]);
      db=r[0]; dl=r[1];
    }
  }catch(e){}
  S.downloads = dl;
  if(db){ S.mode='cloud'; S.db=db; subscribe(); return; }
  var fbOk = await loadFirebase();
  if(fbOk){
    S.mode='firebase';
    try{
      var n=await mergeDuplicateMembers();
      if(n) toast(n+' duplicate player'+(n===1?'':'s')+' merged into one record.');
    }catch(e){}
    computeStats(); onData(true); startFirebasePolling(); return;
  }
  S.mode='local'; loadLocal(); onData(true);
}
function subscribe(){
  var got={m:false,g:false};
  function fail(){ toast("Couldn't load records. Reload the page to try again."); }
  S.db.collection('members').onSnapshot(function(snap){
    S.members = snap.docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
    got.m=true; onData(got.m&&got.g);
  }, fail);
  S.db.collection('games').onSnapshot(function(snap){
    S.games = snap.docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
    got.g=true; onData(got.m&&got.g);
  }, fail);
  S.db.doc('settings/main').onSnapshot(function(snap){
    if(snap.exists){ S.settings = Object.assign({}, DEFAULTS, snap.data()); }
    onData(got.m&&got.g);
  }, fail);
}
function onData(ready){
  if(!ready) return;
  S.ready=true;
  computeStats();
  if(!S.inited){ S.inited=true; initForm(); render(); return; }
  if(isTyping()){ S.dirty=true; updateHeader(); return; }
  refresh();
}
function isTyping(){
  var a=document.activeElement;
  return !!(a && (a.id==='renameIn' || a.id==='newName' || a.id==='payAmt'));
}
function initForm(){
  var draft = readDraft();
  if(draft){
    S.date=draft.date; S.courts=(draft.courts && draft.courts.length) ? draft.courts : [1];
    S.ids=new Set(draft.ids.filter(function(id){return S.members.some(function(m){return m.id===id;});}));
    S.loadedDate = draft.loadedDate;
    return;
  }
  var today = S.games.find(function(g){return g.id===S.date;});
  if(today){ loadGame(today); return; }
  var last = S.games.slice().sort(function(a,b){return b.date.localeCompare(a.date);})[0];
  if(last){ S.courts=gameCourtHours(last); }
}
function loadGame(g){
  S.date=g.date; S.courts=gameCourtHours(g);
  S.ids=new Set(g.playerIds||[]); S.loadedDate=g.date;
}
function computeStats(){
  var st={};
  S.games.forEach(function(g){
    (g.playerIds||[]).forEach(function(id){
      var s = st[id] || (st[id]={count:0,owed:0,paid:0,unpaid:0,last:''});
      s.count++; s.owed += (g.each||0);
      s.paid += gamePaidAmount(g, id);
      if(g.date>s.last) s.last=g.date;
    });
  });
  Object.keys(st).forEach(function(id){
    st[id].unpaid = Math.round((st[id].owed - st[id].paid)*100)/100;
  });
  S.stats=st;
}
/* Find players who share the same name (case/spacing-insensitive) and merge
   them into a single roster entry, folding their game history and payments
   together so there is only ever one record per player. */
async function mergeDuplicateMembers(){
  var groups={};
  S.members.forEach(function(m){
    var key=m.name.trim().toLowerCase();
    (groups[key]=groups[key]||[]).push(m);
  });
  var mergedCount=0;
  for(var key in groups){
    var arr=groups[key];
    if(arr.length<2) continue;
    arr.sort(function(a,b){
      var aActive=a.active!==false, bActive=b.active!==false;
      if(aActive!==bActive) return aActive?-1:1;
      return (a.createdAt||0)-(b.createdAt||0);
    });
    var primary=arr[0], dups=arr.slice(1), dupIds=dups.map(function(d){return d.id;});
    for(var gi=0; gi<S.games.length; gi++){
      var g=S.games[gi], ids=g.playerIds||[];
      if(!ids.some(function(id){return dupIds.indexOf(id)!==-1;})) continue;
      var paid=Object.assign({}, g.paid||{});
      var newIds=[], seenPrimary=ids.indexOf(primary.id)!==-1;
      function curPrimaryAmt(){ var v=paid[primary.id]; if(v&&typeof v==='object') return +v.amount||0; return +v||0; }
      function curPrimaryMethod(){ var v=paid[primary.id]; if(v&&typeof v==='object') return (v.method==='gcash'?'gcash':'cash'); return 'cash'; }
      ids.forEach(function(pid){
        if(dupIds.indexOf(pid)===-1){ newIds.push(pid); return; }
        var info=gamePaidInfo(g,pid);
        delete paid[pid];
        if(seenPrimary){
          if(info.amount>0.001){
            var prevAmt=curPrimaryAmt(), prevMethod=curPrimaryMethod();
            paid[primary.id]={amount:Math.round((prevAmt+info.amount)*100)/100, method:(prevAmt>0.001?prevMethod:info.method)};
          }
        } else {
          newIds.push(primary.id); seenPrimary=true;
          if(info.amount>0.001) paid[primary.id]={amount:info.amount, method:info.method};
        }
      });
      var ng=Object.assign({}, g, {playerIds:newIds, paid:paid});
      delete ng.paidIds;
      try{ await putGame(ng); }catch(e){}
    }
    var anyActive=arr.some(function(a){return a.active!==false;});
    if(primary.active===false && anyActive){
      try{ await putMember(Object.assign({}, primary, {active:true})); }catch(e){}
    }
    for(var di=0; di<dups.length; di++){
      try{ await deleteMember(dups[di].id); mergedCount++; }catch(e){}
    }
  }
  return mergedCount;
}

/* --- home tab --- */
function computeMonthly(){
  var byMonth={};
  S.games.forEach(function(g){
    var k=g.date.slice(0,7);
    var mo = byMonth[k] || (byMonth[k]={key:k,total:0,paid:0,unpaid:0,fund:0,days:0});
    mo.total += g.total||0; mo.fund += gameExcess(g); mo.days += 1;
    (g.playerIds||[]).forEach(function(id){
      var amt=gamePaidAmount(g,id);
      mo.paid += amt;
      var un=(g.each||0)-amt;
      if(un>0.001) mo.unpaid += un;
    });
  });
  return Object.keys(byMonth).sort(function(a,b){return b.localeCompare(a);}).map(function(k){
    var mo=byMonth[k];
    mo.paid=Math.round(mo.paid*100)/100;
    mo.unpaid=Math.round(mo.unpaid*100)/100;
    mo.total=Math.round(mo.total*100)/100;
    mo.fund=Math.round(mo.fund*100)/100;
    mo.label=dfMonth.format(parseDate(k+'-01'));
    return mo;
  });
}
function monthRow(m){
  return '<div class="month-row"><div class="month-row-h"><b>'+esc(m.label)+'</b><span>'+m.days+' day'+(m.days===1?'':'s')+' played</span></div>' +
    '<div class="month-row-g">' +
      '<div><span class="mrl">Court fees</span><b>'+peso(m.total)+'</b></div>' +
      '<div><span class="mrl">Paid</span><b>'+peso(m.paid)+'</b></div>' +
      '<div><span class="mrl">Unpaid</span><b'+(m.unpaid>0.001?' class="danger"':'')+'>'+peso(m.unpaid)+'</b></div>' +
    '</div>' +
    (m.fund>0.001 ? '<div class="month-row-fund"><span class="mrl">Court fund (rounding excess)</span><b>+'+peso(m.fund)+'</b></div>' : '') +
    '</div>';
}
function playerBalanceRow(p){
  return '<button type="button" class="bal-row bal-row-btn" data-act="open-player-detail" data-id="'+esc(p.id)+'">' +
    '<span class="nm">'+esc(p.name)+'<small>'+p.count+' game'+(p.count===1?'':'s')+' · '+peso(p.paid)+' paid</small></span>' +
    '<span class="bal-amt'+(p.unpaid>0.001?' danger':(p.unpaid<-0.001?' credit':''))+'">'+balanceText(p.unpaid)+'</span>' +
    '</button>';
}
function homeShell(){
  var monthly = computeMonthly();
  var active = S.members.filter(function(m){ return m.active!==false; });
  var rows = active.map(function(m){
    var s = S.stats[m.id] || {count:0, owed:0, paid:0, unpaid:0};
    return Object.assign({id:m.id, name:m.name}, s);
  }).sort(function(a,b){
    var d = b.unpaid - a.unpaid;
    if(Math.abs(d)>0.001) return d;
    return cmpName(a.name,b.name);
  });
  var totalUnpaid = Math.round(rows.reduce(function(a,r){ return a + Math.max(0,r.unpaid); }, 0)*100)/100;
  var html = '<section class="card" style="margin-top:0"><div class="sec-h"><h2>Monthly summary</h2></div>' +
    (monthly.length ? monthly.map(monthRow).join('') : '<p class="hint">No games recorded yet.</p>') +
    '</section>';
  html += '<section class="card"><div class="sec-h"><h2>Player balances</h2><span class="count">'+peso(totalUnpaid)+' owed</span></div>' +
    (rows.length ? rows.map(playerBalanceRow).join('') : '<p class="hint">No players yet.</p>') +
    (rows.length ? '<p class="hint" style="margin-top:10px">Tap a player to see their day-by-day payment history.</p>' : '') +
    '</section>';
  return html;
}
function openPlayerDetail(id){

function gameCard(g){

    var confirm = S.confirmDel===g.id;

      '<div class="chips">'+sorted.map(function(id){

        var full = amt>0.001 && amt>=(g.each||0)-0.001;

      }).join('')+'</div>' +

      '<button class="btn ghost sm danger" data-act="del-game" data-id="'+esc(g.id)+'">'+(confirm?'Tap again to delete':'Delete')+'</button></div></div>';

async function copyText(t){

  try{
    var ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select(); var ok=document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

function summary(date, courtHours, ids, each, total, rate){
  var names=ids.map(nameOf).sort(cmpName), n=ids.length;

    courtsSummary(courtHours)+' \u00D7 '+peso(rate)+' = '+peso(total)+'\n' +
    n+' player'+(n===1?'':'s')+' \u00B7 '+peso(each)+' each\n\n' +
    names.map(function(x){return '\u2022 '+x;}).join('\n');

async function addMember(raw){
  var name=String(raw||'').replace(/\s+/g,' ').trim();
  if(!name) return null;
  if(S.mode==='firebase'){
    /* refresh from the shared database right before checking, so two people
       adding the same name at nearly the same time still land on one record */
    try{ await loadFirebase(); computeStats(); }catch(e){}
  }
  var ex=S.members.find(function(m){return m.name.toLowerCase()===name.toLowerCase();});
  if(ex){
    if(ex.active===false) await putMember(Object.assign({},ex,{active:true}));
    return {id:ex.id, existed:true, name:ex.name};
  }
  var m={id:uid(), name:name, active:true, createdAt:Date.now()};
  await putMember(m);
  return {id:m.id, existed:false, name:name};
}
async function addFromSearch(){
  var q=S.q;
  try{
    var r=await addMember(q);
    if(!r) return;
    S.ids.add(r.id); S.q='';
    var qi=$('#q'); if(qi){ qi.value=''; }
    computeStats(); updateRoster(); after();
    toast(r.existed ? r.name+' is already in your roster. Tagged.' : r.name+' added and tagged.');
  }catch(e){ saveError(); }
}

async function saveGame(){
  var ids=presentIds();
  if(!ids.length || S.busy) return;
  S.busy=true;
  var c=curCalc();
  var ex=S.games.find(function(g){return g.id===S.date;});
  var keptPaid={};
  if(ex){ ids.forEach(function(id){ var info=gamePaidInfo(ex,id); if(info.amount>0.001) keptPaid[id]={amount:info.amount, method:info.method}; }); }
  var g={id:S.date,date:S.date,courts:S.courts.slice(),playerIds:ids,paid:keptPaid,total:c.total,each:c.each,rate:S.settings.rate,minFee:S.settings.minFee,createdAt:(ex&&ex.createdAt)||Date.now(),updatedAt:Date.now()};
  try{
    await putGame(g);
    S.loadedDate=S.date; computeStats(); saveDraft();
    updateWhen(); updateRoster(); updateSaveBar(); updateBalances();
    toast((ex?'Record updated':'Game saved')+' \u00B7 '+peso(c.each)+' each');
  }catch(e){ saveError(); }
  S.busy=false;
}
function csvCell(v){ v=String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
async function exportCsv(){
  if(!S.downloads) return;
  var rows=[['Date','Courts (hrs each)','Total hours','Court fee total','Each pays','Fund excess','Players','Names','Fully paid','Not fully paid','Cash payers','GCash payers']];
  S.games.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(g){
    var ids=g.playerIds||[];
    var ch=gameCourtHours(g);
    var totalHours=ch.reduce(function(a,h){return a+(+h||0);},0);
    var isFull=function(id){ var a=gamePaidAmount(g,id); return a>0.001 && a>=(g.each||0)-0.001; };
    var paidNames=ids.filter(isFull).map(nameOf).sort(cmpName);
    var unpaidNames=ids.filter(function(id){return !isFull(id);}).map(nameOf).sort(cmpName);
    var cashNames=ids.filter(function(id){ return gamePaidAmount(g,id)>0.001 && gamePaidMethod(g,id)==='cash'; }).map(nameOf).sort(cmpName);
    var gcashNames=ids.filter(function(id){ return gamePaidAmount(g,id)>0.001 && gamePaidMethod(g,id)==='gcash'; }).map(nameOf).sort(cmpName);
    rows.push([g.date,courtsSummary(ch),totalHours,g.total,g.each,gameExcess(g),ids.length,ids.map(nameOf).sort(cmpName).join('; '),paidNames.join('; '),unpaidNames.join('; '),cashNames.join('; '),gcashNames.join('; ')]);
  });
  var csv='\uFEFF'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\n');
  try{ await S.downloads.save({filename:'takas-pickleball-records.csv', data:csv}); }
  catch(e){ if(e && e.code!=='declined') toast("Couldn't create the file here."); }
}

/* ---------- events ---------- */
document.addEventListener('click', async function(e){
  var ov=e.target.closest('[data-overlay]');
  if(ov && e.target===ov){ closeSheet(); return; }
  var tabBtn=e.target.closest('[data-tab]');
  if(tabBtn){ setTab(tabBtn.dataset.tab); return; }
  var el=e.target.closest('[data-act]'); if(!el) return;
  var act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case 'today': setDate(todayStr()); break;
    case 'court-hrs-': { var chi=+el.dataset.i; S.courts[chi]=Math.max(0.5, (S.courts[chi]||0)-0.5); updateCourtsList(); after(); break; }
    case 'court-hrs+': { var chi2=+el.dataset.i; S.courts[chi2]=Math.min(12, (S.courts[chi2]||0)+0.5); updateCourtsList(); after(); break; }
    case 'add-court': S.courts.push(1); updateCourtsList(); after(); break;
    case 'remove-court': {
      var cri=+el.dataset.i;
      if(S.courts.length>1) S.courts.splice(cri,1);
      updateCourtsList(); after(); break;
    }
    case 'toggle':
      if(S.ids.has(id)) S.ids.delete(id); else S.ids.add(id);
      el.classList.toggle('on', S.ids.has(id)); el.setAttribute('aria-checked', String(S.ids.has(id)));
      after(); break;
    case 'clear-all': S.ids=new Set(); updateRoster(); after(); break;
    case 'add-from-search': addFromSearch(); break;
    case 'save': saveGame(); break;
    case 'copy-current': {
      var ids=presentIds(), c=curCalc();
      shareText(summary(S.date,S.courts,ids,c.each,c.total,S.settings.rate)); break;
    }
    case 'open-game': S.openGame = (S.openGame===id ? null : id); S.confirmDel=null; render(); break;
    case 'toggle-paid': {
      var gid=el.dataset.game, tpid=id;
      promptAdmin(function(){
        if(S.payEdit && S.payEdit.game===gid && S.payEdit.id===tpid){
          S.payEdit=null;
        } else {
          var gmO=S.games.find(function(x){return x.id===gid;});
          var infoO=gmO?gamePaidInfo(gmO,tpid):{amount:0,method:'cash'};
          var defAmt = infoO.amount>0.001 ? infoO.amount : (gmO?(gmO.each||0):0);
          S.payEdit={game:gid, id:tpid, amount:defAmt, method:infoO.method};
        }
        render();
      });
      break;
    }
    case 'pay-method': {
      if(S.payEdit) S.payEdit.method = el.dataset.v;
      var row=el.closest('.pay-edit-row');
      if(row){
        row.dataset.method = el.dataset.v;
        Array.from(el.parentElement.children).forEach(function(b){ b.setAttribute('aria-pressed', String(b===el)); });
      }
      break;
    }
    case 'cancel-pay-inline': S.payEdit=null; render(); break;
    case 'mark-unpaid-inline': {
      var mgid=el.dataset.game, mpid=id;
      promptAdmin(async function(){
        var mgm=S.games.find(function(x){return x.id===mgid;});
        if(!mgm) return;
        var paidObjM=Object.assign({}, mgm.paid||{});
        paidObjM[mpid]={amount:0, method:gamePaidMethod(mgm,mpid)};
        var ngM=Object.assign({}, mgm, {paid:paidObjM});
        delete ngM.paidIds;
        try{ await putGame(ngM); computeStats(); S.payEdit=null; render(); toast('Marked unpaid'); }
        catch(err){ saveError(); }
      });
      break;
    }
    case 'save-pay-inline': {
      var sgid2=el.dataset.game, spid=id;
      promptAdmin(async function(){
        var sgm2=S.games.find(function(x){return x.id===sgid2;});
        if(!sgm2) return;
        var amtIn=$('#payAmt'); var v=amtIn?parseFloat(amtIn.value):(S.payEdit?parseFloat(S.payEdit.amount):0);
        if(!(v>=0)) v=0;
        var method2=(S.payEdit && S.payEdit.method==='gcash') ? 'gcash' : 'cash';
        var paidObjS=Object.assign({}, sgm2.paid||{});
        paidObjS[spid]={amount:Math.round(v*100)/100, method:method2};
        var ngS=Object.assign({}, sgm2, {paid:paidObjS});
        delete ngS.paidIds;
        try{ await putGame(ngS); computeStats(); S.payEdit=null; render(); toast('Payment saved'); }
        catch(err){ saveError(); }
      });
      break;
    }
    case 'edit-paid': { var epid=id; promptAdmin(function(){ openPaidSheet(epid); }); break; }
    case 'remove-from-game': {
      var rgid=el.dataset.game, rpid=id;
      promptAdmin(async function(){
        var rgm=S.games.find(function(x){return x.id===rgid;});
        if(!rgm) return;
        var rname=nameOf(rpid);
        var newIds=(rgm.playerIds||[]).filter(function(x){return x!==rpid;});
        var rpaid=Object.assign({}, rgm.paid||{});
        delete rpaid[rpid];
        var rc=calc(gameCourtHours(rgm), newIds.length, {rate:rgm.rate||S.settings.rate, minFee:rgm.minFee||S.settings.minFee});
        var rng=Object.assign({}, rgm, {playerIds:newIds, paid:rpaid, total:rc.total, each:rc.each});
        delete rng.paidIds;
        try{
          await putGame(rng); computeStats();
          if(newIds.length) openPaidSheet(rgid); else closeSheet();
          render(); toast(rname+' removed from this record.');
        }catch(err){ saveError(); }
      });
      break;
    }
    case 'save-paid': {
      var sgid=id;
      promptAdmin(async function(){
        var sgm=S.games.find(function(x){return x.id===sgid;});
        if(!sgm) return;
        var inputs=$$('#sheet input[data-pid]');
        var selects=$$('#sheet select[data-pid]');
        var paidObj2=Object.assign({}, sgm.paid||{});
        inputs.forEach(function(inp){
          var pid=inp.dataset.pid, v=parseFloat(inp.value);
          if(!(v>=0)) v=0;
          var sel=selects.find(function(s){return s.dataset.pid===pid;});
          var method=(sel && sel.value==='gcash') ? 'gcash' : 'cash';
          paidObj2[pid]={amount:Math.round(v*100)/100, method:method};
        });
        var ng2=Object.assign({}, sgm, {paid:paidObj2});
        delete ng2.paidIds;
        try{ await putGame(ng2); computeStats(); closeSheet(); render(); toast('Payments updated'); }
        catch(err){ saveError(); }
      });
      break;
    }
    case 'open-player-detail': openPlayerDetail(id); break;
    case 'edit-game': {
      var g=S.games.find(function(x){return x.id===id;});
      if(g){ loadGame(g); saveDraft(); setTab('game'); toast('Record loaded. Make changes, then tap Update record.'); }
      break;
    }
    case 'copy-game': {
      var gg=S.games.find(function(x){return x.id===id;});
      if(gg) shareText(summary(gg.date,gameCourtHours(gg),gg.playerIds||[],gg.each||0,gg.total||0,gg.rate||S.settings.rate));
      break;
    }
    case 'del-game':
      if(S.confirmDel===id){
        try{ await removeGame(id); if(S.loadedDate===id){ S.loadedDate=null; saveDraft(); } S.openGame=null; S.confirmDel=null; computeStats(); render(); toast('Record deleted'); }
        catch(err){ saveError(); }
      } else {
        S.confirmDel=id; render();
        setTimeout(function(){ if(S.confirmDel===id){ S.confirmDel=null; if(S.tab==='records') render(); } }, 4000);
      }
      break;
    case 'csv': exportCsv(); break;
    case 'add-member': {
      var inp=$('#newName'); var raw=inp.value;
      try{
        var r=await addMember(raw);
        if(r){ inp.value=''; computeStats(); updateMemberList(); toast(r.existed ? r.name+' is already on your roster.' : r.name+' added.'); }
      }catch(err){ saveError(); }
      break;
    }
    case 'sort': S.sortBy=el.dataset.v; render(); break;
    case 'open-member': S.openMember = (S.openMember===id ? null : id); updateMemberList(); { var ri=$('#renameIn'); if(ri) ri.focus(); } break;
    case 'rename': await doRename(id); break;
    case 'remove-member': {
      var m=S.members.find(function(x){return x.id===id;});
      if(m){ try{ await putMember(Object.assign({},m,{active:false})); S.ids.delete(id); S.openMember=null; saveDraft(); updateMemberList(); toast(m.name+' removed from the roster.'); }catch(err){ saveError(); } }
      break;
    }
    case 'restore-member': {
      var m2=S.members.find(function(x){return x.id===id;});
      if(m2){ try{ await putMember(Object.assign({},m2,{active:true})); updateMemberList(); toast(m2.name+' restored.'); }catch(err){ saveError(); } }
      break;
    }
    case 'toggle-hidden': S.showHidden=!S.showHidden; updateMemberList(); break;
    case 'open-rules': promptAdmin(openRules); break;
    case 'close-sheet': closeSheet(); break;
    case 'lock-admin':
      try{ localStorage.removeItem(ADMIN_KEY); }catch(e){}
      toast('Locked. PIN required again for payments.'); updateHeader();
      if(S.tab==='records' || S.tab==='home') render();
      break;
    case 'submit-pin': {
      var pinIn=$('#pinIn'); var v=pinIn?pinIn.value.trim():'';
      if(v && v===String(S.settings.pin||'')){
        try{ localStorage.setItem(ADMIN_KEY,'1'); }catch(e){}
        var cb=S.pendingAdminCb; S.pendingAdminCb=null;
        closeSheet(); updateHeader();
        if(cb) cb();
      } else {
        toast('Incorrect PIN.');
      }
      break;
    }
    case 'save-rules': {
      var rate=parseFloat($('#ruleRate').value), min=parseFloat($('#ruleMin').value);
      var pinEl=$('#rulePin'); var pin = pinEl ? pinEl.value.replace(/\s+/g,'').trim() : (S.settings.pin||'');
      if(!(rate>0) || !(min>=0)){ toast('Enter a court fee above 0 and a minimum of 0 or more.'); break; }
      try{
        await putSettings({rate:rate,minFee:min,pin:pin}); closeSheet(); updateHeader();
        if(S.tab==='game') refreshGame(); else if(S.tab==='home') render();
        toast('Fee rules saved');
      }
      catch(err){ saveError(); }
      break;
    }
  }
});
async function doRename(id){
  var inp=$('#renameIn'); if(!inp) return;
  var name=inp.value.replace(/\s+/g,' ').trim();
  var m=S.members.find(function(x){return x.id===id;});
  if(!m || !name) { toast('Enter a name first.'); return; }
  var dup=S.members.find(function(x){return x.id!==id && x.name.toLowerCase()===name.toLowerCase();});
  if(dup){ toast(dup.name+' is already on your roster.'); return; }
  try{ await putMember(Object.assign({},m,{name:name})); S.openMember=null; updateMemberList(); toast('Name updated'); }
  catch(err){ saveError(); }
}
document.addEventListener('input', function(e){
  if(e.target.id==='q'){ S.q=e.target.value; updateRoster(); }
  if(e.target.id==='payAmt' && S.payEdit){ S.payEdit.amount=e.target.value; }
});
document.addEventListener('change', function(e){
  if(e.target.id==='date') setDate(e.target.value);
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && $('#sheet').firstChild){ closeSheet(); return; }
  if(e.key!=='Enter') return;
  var id=e.target.id;
  if(id==='q'){ e.preventDefault(); var q=S.q.trim(); if(q){ var ex=S.members.some(function(m){return m.active!==false && m.name.toLowerCase()===q.toLowerCase();}); if(!ex) addFromSearch(); } }
  else if(id==='newName'){ e.preventDefault(); var b=$('[data-act="add-member"]'); if(b) b.click(); }
  else if(id==='renameIn'){ e.preventDefault(); var b2=$('[data-act="rename"]'); if(b2) b2.click(); }
  else if(id==='pinIn'){ e.preventDefault(); var b3=$('[data-act="submit-pin"]'); if(b3) b3.click(); }
});
document.addEventListener('focusout', function(e){
  if((e.target.id==='renameIn'||e.target.id==='newName') && S.dirty){
    S.dirty=false; setTimeout(function(){ if(!isTyping()) refresh(); }, 0);
  }
});

boot();
})();
</script>
</body>
</html>
